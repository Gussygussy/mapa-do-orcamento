<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore em árvore as despesas e receitas públicas do Brasil em 2025." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Orçamento Brasil 2025</title>
    <script>
      // Aplica o tema antes da renderização para evitar flash. localStorage é opcional.
      // Ordem: escolha salva no botão > data-theme do ambiente que hospeda a página > sistema.
      (function () {
        var t = null;
        try { t = localStorage.getItem("tema"); } catch (e) {}
        var raiz = document.documentElement;
        var hospede = raiz.getAttribute("data-theme");
        var escuro = t ? t === "escuro" : hospede ? hospede === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (escuro) raiz.classList.add("dark");
        raiz.style.colorScheme = escuro ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
